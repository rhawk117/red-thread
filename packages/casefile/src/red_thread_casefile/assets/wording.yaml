# The words a case file's board and lens outputs use.
# headings: one per entry kind, in the order the board shows its sections.
headings:
  - kind: decision
    title: Decided
    note: What the owner decided or wants taken as given.
  - kind: known
    title: Known
    note: Claims with a citation that was opened and checked.
  - kind: hypothesis
    title: Hypotheses
    note: Explanations still to test, each with what would refute it.
  - kind: open
    title: Open
    note: Questions and claims that are not established yet.
  - kind: ruled_out
    title: Ruled out
    note: Dead ends, each closed by a citation or by the owner.
  - kind: next
    title: Next
    note: Steps left for whoever picks the case up.
  - kind: resource
    title: Resources
    note: Sources and references the case points to.

# prefixes: the text written before the value of each kind of note on an entry.
prefixes:
  rests_on: 'rests on: '
  refuted_by: 'refuted by: '
  retires: 'retires: '
  retired_by: 'retired by '
  urgency: ''
  source: ''

map_note: Each thread as a line of its entries, with an arrow from an entry to the one it retired.
retired_note: Entries a later entry replaced. The ledger keeps them and the sections leave them out.

# terms: the board page's glossary, in the order it lists them.
terms:
  - word: Case
    meaning: >-
      One investigation, kept in .red-thread/ with its ledger and this board. The board is drawn
      from the ledger every time, never edited by hand.
  - word: Bar
    meaning: 'What would count as an answer: the case is done when the bar is met.'
  - word: Entry and ref
    meaning: >-
      One recorded finding, question or step. Its ref, such as e4 or T1.e2, is its address, and a
      link to board.html#e4 opens the board at that entry.
  - word: Thread
    meaning: >-
      A line of entries on one question, such as T1. An entry outside a thread belongs to the case
      as a whole.
  - word: Round
    meaning: One pass of research by the scouts, and the review of what they found.
  - word: Decided, known, hypothesis, open, ruled out
    meaning: >-
      The kinds of entry: what the owner decided, a claim with a checked citation, an explanation
      still to test, a question not settled yet, and a dead end.
  - word: Citation
    meaning: >-
      The file and lines a claim rests on. It reads ok while the lines still say what was quoted,
      and moved, changed or missing once the code has drifted.
  - word: Retired
    meaning: >-
      An entry a later entry replaced. The ledger keeps it, and the board folds it away at the
      bottom.
