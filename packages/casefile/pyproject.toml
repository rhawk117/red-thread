[project]
name = "red-thread-casefile"
version = "0.1.0"
description = "The case file behind red-thread: an append-only investigation ledger and its board"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts==5.5.3",
    "msgspec>=0.22.0",
]

[project.scripts]
red-thread-casefile = "red_thread_casefile:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
