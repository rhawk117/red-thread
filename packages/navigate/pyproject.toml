[project]
name = "red-thread-navigate"
version = "0.1.0"
description = "Code navigation behind red-thread: a symbol map, symbol search and code slices"
readme = "README.md"
authors = [
    { name = "rhawk117", email = "noplaceLike127dot0dot0dot1@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts==5.5.3",
    "red-thread-core",
    "tree-sitter==0.27.0",
    "tree-sitter-go==0.25.0",
    "tree-sitter-hcl==1.2.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-typescript==0.23.2",
]

[project.scripts]
redthread-navigate = "red_thread_navigate:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
red-thread-core = { workspace = true }
